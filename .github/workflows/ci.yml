name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build before typecheck/test: apps/vscode imports @unravel-code/core by
      # its published entry point (dist/index.d.ts), which only exists after
      # packages/core has been built. On a fresh checkout that directory does
      # not exist yet, so typechecking first fails with "Cannot find module
      # '@unravel-code/core'" even though the code is correct.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
